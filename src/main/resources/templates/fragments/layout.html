<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layoutBase(contenido, scripts)">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" type="image/png" href="https://www.entel-ofertas.cl/assets/entel-logo.e51f40b3.png">
    <title>Sistema de Inventario de Equipos Eléctricos</title>

    <!-- Bootstrap / iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Estilos propios -->
    <link href="/css/index.css" rel="stylesheet" />

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.min.css">
</head>

<body class="app-body bg-light">
<div class="topbar d-flex align-items-center px-3">
    <div class="ms-auto d-flex align-items-center" style="max-width: 280px;">
        <div class="input-group">
            <span class="input-group-text bg-white border-0 rounded-start-3">
                <i class="fas fa-search text-muted"></i>
            </span>
            <input type="text" class="form-control form-control-sm border-0" placeholder="Buscar en inventario...">
        </div>
    </div>
</div>

<div class="d-flex">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar bg-white shadow-sm">
        <div class="sidebar-header text-center py-4">
            <img src="/assets/img/promhil_logo.jpg" alt="Promhil" class="img-fluid mb-2" style="max-height:46px;">
            <small class="text-muted d-block">Admin Promhil</small>
        </div>
        <hr class="my-0">
        <nav class="sidebar-nav py-3">
            <p class="sidebar-section-title">INVENTARIO</p>
            <a class="sidebar-link" th:href="@{/dashboard}">
                <i class="fa-solid fa-gauge-high me-2"></i> Panel principal
            </a>
            <a class="sidebar-link" th:href="@{/boleta/listado}">
                <i class="fa-solid fa-file-lines me-2"></i> Movimientos / Salidas
            </a>
            <a class="sidebar-link" th:href="@{/producto/listado}">
                <i class="fa-solid fa-layer-group me-2"></i> Equipos eléctricos
            </a>

			<p class="sidebar-section-title mt-4">CUENTA</p>

			<!-- SOLO ADMIN -->
			<th:block th:if="${idTipo == 1}">
			    <a class="sidebar-link" th:href="@{/usuarios}">
			        <i class="fa-solid fa-user me-2"></i> Perfiles
			    </a>
			</th:block>

			<!-- TODOS -->
			<a class="sidebar-link text-danger" th:href="@{/cerrar-sesion}">
			    <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Cerrar sesión
			</a>
        </nav>
    </aside>

    <!-- CONTENIDO -->
    <main class="content-area flex-fill">
        <div class="page-wrapper">
            <div class="container-fluid px-0" th:insert="~{::contenido}"></div>
        </div>
    </main>
</div>

<!-- JS base -->
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.min.js"></script>

<!-- scripts específicos -->
<th:block th:replace="${scripts} ?: ~{}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('iconNavbarSidenav');
        if (!btn) return;
        btn.addEventListener('click', function () {
            document.body.classList.toggle('sidebar-collapsed');
        });
    });
</script>

</body>
</html>
