<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Iniciar sesión | Promhil</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="/css/index.css"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

<main class="main-content mt-0">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center">
            <!-- formulario -->
            <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="fw-bold">Iniciar sesión</h4>
                        <p class="text-muted mb-4">Ingrese su usuario y contraseña para acceder al inventario.</p>

                        <form class="row g-3" th:action="@{/iniciar-sesion}" method="post" th:object="${filter}">
                            <div class="col-12">
                                <label class="form-label">Usuario / correo</label>
                                <div class="input-group">
                                    <span class="input-group-text ps-3 pe-3">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control form-control-lg"
                                           placeholder="Usuario / correo" th:field="*{cuenta}">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text ps-3 pe-3">
                                        <i class="fa-solid fa-key"></i>
                                    </span>
                                    <input id="clave" type="password" class="form-control form-control-lg"
                                           placeholder="Contraseña" th:field="*{clave}">
                                </div>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox"
                                           onclick="togglePassword(this, 'clave')" id="toggle-password">
                                    <label class="form-check-label" for="toggle-password">Mostrar contraseña</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-app-primary w-100 btn-lg">Ingresar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- panel derecho con imagen -->
            <div class="col-lg-6 d-none d-lg-flex">
                <div class="login-right-panel w-100">
                    <div class="position-relative" style="z-index: 3;">
                        <p class="text-uppercase mb-1" style="letter-spacing: .25rem; font-size: .7rem; opacity: .7;">
                            Sistema de inventario
                        </p>
                        <h1 class="login-right-title mb-2">PROMHIL</h1>
                        <p class="login-right-subtitle">
                            Controla tus equipos, reduce pérdidas y asegura disponibilidad.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<th:block th:utext="${alert}"></th:block>

<script>
    function togglePassword(checkbox, inputId) {
        const input = document.getElementById(inputId);
        if (input) {
            input.type = checkbox.checked ? 'text' : 'password';
        }
    }
</script>

</body>
</html>
